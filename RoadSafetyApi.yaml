openapi: 3.1.0
info:
  title: RoadSafety API
  version: "1.0.0"
  description: |
    REST API для приложения RoadSafety.
    Один клиент используется и для родителей, и для детей, а роль пользователя хранится на сервере
    и задаётся при подключении к семье.

    Основной поток:
    1. Родитель регистрируется (без роли).
    2. Родитель присоединяется к семье или создаёт новую семью (становится parent).
    3. Родитель генерирует одноразовый код для ребёнка.
    4. Ребёнок регистрируется (без роли).
    5. Ребёнок вводит код.
    6. Сервер устанавливает ребёнку роль child и создаёт запись FamilyMember.

servers:
  - url: http://localhost:5103/api
    description: Local development server

tags:
  - name: Auth
  - name: Users
  - name: Families
  - name: Maps
  - name: Tracking

security:
  - BearerAuth: []

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: |
        Создаёт аккаунт с email или номером телефона и сразу возвращает access/refresh токены.
        Роль пользователя будет установлена при подключении к семье.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Email or phone already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login
      description: Авторизация по email или телефону и паролю.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh tokens
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokensRequest"
      responses:
        "200":
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokensResponse"
        "401":
          description: Refresh token invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout
      description: Инвалидирует refresh token текущей сессии.
      operationId: logoutUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogOutRequest"
      responses:
        "204":
          description: Logged out
        "401":
          description: Refresh token invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /users:
    get:
      tags:
        - Users
      summary: Get user by email or phone
      description: Поиск пользователя по email или номеру телефона. Требует авторизации.
      operationId: getUserByContact
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
          description: Email пользователя.
        - name: phone
          in: query
          required: false
          schema:
            type: string
          description: Номер телефона в E.164 формате (например +79991234567).
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Neither email nor phone provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /users/me:
    get:
      tags:
        - Users
      summary: Get current user info
      description: Получить информацию о текущем пользователе по ID из JWT токена, включая ID семьи.
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /families:
    post:
      tags:
        - Families
      summary: Create family
      description: |
        При создании семьи пользователю устанавливается роль `parent`.
        Сервер автоматически создаёт запись FamilyMember для текущего пользователя.
      operationId: createFamily
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyRequest"
      responses:
        "201":
          description: Family created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateFamilyResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /families/{familyId}/members:
    get:
      tags:
        - Families
      summary: List family members
      description: Возвращает id и роль участников семьи.
      operationId: listFamilyMembers
      parameters:
        - name: familyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Family identifier
      responses:
        "200":
          description: Family members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetFamilyMembersResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Family not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /families/invite-code:
    post:
      tags:
        - Families
      summary: Generate family invite code
      description: |
        Только для родителя, состоящего в семье.
        Генерирует одноразовый код для приглашения других пользователей в семью с указанной ролью.
      operationId: createInviteCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteCodeRequest"
      responses:
        "200":
          description: Invite code created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInviteCodeResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized or insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Family or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /families/join-by-invite:
    post:
      tags:
        - Families
      summary: Join family using invite code
      description: |
        По валидному одноразовому коду сервер создаёт запись FamilyMember и добавляет пользователя в семью.
      operationId: joinFamilyByInviteCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinFamilyByInviteCodeRequest"
      responses:
        "200":
          description: Successfully joined family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinFamilyByInviteCodeResponse"
        "400":
          description: Validation error (e.g. code expired, user already in family)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Invite code or family not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"


  /maps/areas:
    get:
      tags:
        - Maps
      summary: Get base risk areas by bounding box
      description: |
        Returns generated base map areas intersecting the requested bbox.
        The bbox format is minLon,minLat,maxLon,maxLat in WGS84.
      operationId: getMapAreas
      parameters:
        - name: bbox
          in: query
          required: true
          schema:
            type: string
            pattern: "^-?\\d+(\\.\\d+)?,-?\\d+(\\.\\d+)?,-?\\d+(\\.\\d+)?,-?\\d+(\\.\\d+)?$"
            example: "37.50,55.70,37.70,55.80"
          description: WGS84 bounding box as minLon,minLat,maxLon,maxLat.
        - name: cityId
          in: query
          required: false
          schema:
            type: string
          description: Optional city/batch identifier.
      responses:
        "200":
          description: Base risk areas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapAreaFeatureCollection"
        "400":
          description: Invalid bbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /maps/user-areas:
    get:
      tags:
        - Maps
      summary: Get family user risk areas
      description: Returns parent-created or parent-overridden risk areas for the current user's family.
      operationId: getUserMapAreas
      parameters:
        - name: familyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: childId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: If omitted, returns family-wide areas.
      responses:
        "200":
          description: User risk areas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMapAreaFeatureCollection"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Family not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    post:
      tags:
        - Maps
      summary: Create a family user risk area
      description: Creates either an override for an existing base area or a custom polygon drawn by a parent.
      operationId: createUserMapArea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserMapAreaRequest"
      responses:
        "201":
          description: User risk area created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMapAreaFeature"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: User is not allowed to edit this family map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /tracking/location:
    post:
      tags:
        - Tracking
      summary: Submit current child location
      description: |
        Updates the current child location, resolves the effective risk level
        using user areas first and base map areas second, and prepares data for
        parent map display and scoring.
      operationId: submitChildLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitLocationRequest"
      responses:
        "200":
          description: Location accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitLocationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /tracking/children/{childId}/location:
    get:
      tags:
        - Tracking
      summary: Get current child location
      operationId: getChildLocation
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current child location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildLocationResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /tracking/children/{childId}/stats:
    get:
      tags:
        - Tracking
      summary: Get child score and rating
      operationId: getChildStats
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Child stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildStatsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Child stats not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ProblemDetails:
      type: object
      description: RFC 7807 problem details (ASP.NET Core output)
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true

    RegisterRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          description: Email или телефон.
        password:
          type: string
          format: password

    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          description: Email или телефон.
        password:
          type: string
          format: password

    RefreshTokensRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    LogOutRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    AuthResponse:
      type: object
      required:
        - userId
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
      properties:
        userId:
          type: string
          format: uuid
          description: Unique identifier of the authenticated user.
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: Absolute expiration time of the access token.
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: Absolute expiration time of the refresh token.

    RefreshTokensResponse:
      type: object
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time

    UserResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          nullable: true
        phoneNumber:
          type: string
          nullable: true
          example: "+79991234567"
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        patronymic:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        familyId:
          type: string
          format: uuid
          nullable: true

    CreateFamilyRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: Название семьи (опционально).

    CreateFamilyResponse:
      type: object
      required:
        - familyId
        - createdByUserId
      properties:
        familyId:
          type: string
          format: uuid
        createdByUserId:
          type: string
          format: uuid

    GetFamilyMembersResponse:
      type: object
      required:
        - members
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/MemberDto"

    MemberDto:
      type: object
      required:
        - id
        - role
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          description: Роль участника в семье (Parent, Child).

    CreateInviteCodeRequest:
      type: object
      required:
        - inviteCodeRole
      properties:
        inviteCodeRole:
          type: string
          enum:
            - Parent
            - Child
          description: Роль, для которой создаётся код (Parent или Child).

    CreateInviteCodeResponse:
      type: object
      required:
        - inviteCode
      properties:
        inviteCode:
          type: string
          description: Одноразовый код приглашения.

    JoinFamilyByInviteCodeRequest:
      type: object
      required:
        - inviteCode
      properties:
        inviteCode:
          type: string

    JoinFamilyByInviteCodeResponse:
      type: object
      required:
        - userId
        - familyId
        - role
      properties:
        userId:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        role:
          type: string
          description: Роль, присвоенная пользователю в семье.

    RiskLevel:
      type: string
      enum:
        - green
        - yellow
        - red
      description: Semantic risk level. The client decides how to render colors.

    GeoJsonGeometry:
      type: object
      description: GeoJSON geometry object in WGS84.
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - Point
            - LineString
            - Polygon
            - MultiPolygon
        coordinates:
          description: GeoJSON coordinates.

    MapAreaProperties:
      type: object
      required:
        - id
        - risk
      properties:
        id:
          type: string
          format: uuid
        osmId:
          type: integer
          format: int64
          nullable: true
          description: Nullable for generated green zones.
        risk:
          $ref: "#/components/schemas/RiskLevel"
        cityId:
          type: string
          nullable: true

    MapAreaFeature:
      type: object
      required:
        - type
        - geometry
        - properties
      properties:
        type:
          type: string
          const: Feature
        geometry:
          $ref: "#/components/schemas/GeoJsonGeometry"
        properties:
          $ref: "#/components/schemas/MapAreaProperties"

    MapAreaFeatureCollection:
      type: object
      required:
        - type
        - features
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: "#/components/schemas/MapAreaFeature"

    UserMapAreaProperties:
      type: object
      required:
        - id
        - familyId
        - risk
      properties:
        id:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
          nullable: true
          description: Null means the area applies to all children in the family.
        baseAreaId:
          type: string
          format: uuid
          nullable: true
          description: Null if parent drew a custom polygon.
        risk:
          $ref: "#/components/schemas/RiskLevel"
        createdByUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    UserMapAreaFeature:
      type: object
      required:
        - type
        - geometry
        - properties
      properties:
        type:
          type: string
          const: Feature
        geometry:
          $ref: "#/components/schemas/GeoJsonGeometry"
        properties:
          $ref: "#/components/schemas/UserMapAreaProperties"

    UserMapAreaFeatureCollection:
      type: object
      required:
        - type
        - features
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: "#/components/schemas/UserMapAreaFeature"

    CreateUserMapAreaRequest:
      type: object
      required:
        - familyId
        - risk
        - geometry
      properties:
        familyId:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
          nullable: true
          description: Null means the area applies to all children in the family.
        baseAreaId:
          type: string
          format: uuid
          nullable: true
          description: Set when overriding an existing base area.
        risk:
          $ref: "#/components/schemas/RiskLevel"
        geometry:
          $ref: "#/components/schemas/GeoJsonGeometry"

    SubmitLocationRequest:
      type: object
      required:
        - latitude
        - longitude
      properties:
        childId:
          type: string
          format: uuid
          nullable: true
          description: Optional for child clients; defaults to the authenticated user.
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          format: double
          minimum: 0
          nullable: true
        recordedAt:
          type: string
          format: date-time
          nullable: true
          description: Client-side timestamp. Server time is used when omitted.

    SubmitLocationResponse:
      type: object
      required:
        - childId
        - currentRisk
        - lastUpdatedAt
      properties:
        childId:
          type: string
          format: uuid
        currentRisk:
          $ref: "#/components/schemas/RiskLevel"
        matchedUserAreaId:
          type: string
          format: uuid
          nullable: true
        matchedBaseAreaId:
          type: string
          format: uuid
          nullable: true
        lastUpdatedAt:
          type: string
          format: date-time

    ChildLocationResponse:
      type: object
      required:
        - childId
        - latitude
        - longitude
        - currentRisk
        - lastUpdatedAt
      properties:
        childId:
          type: string
          format: uuid
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        accuracyMeters:
          type: number
          format: double
          nullable: true
        currentRisk:
          $ref: "#/components/schemas/RiskLevel"
        lastUpdatedAt:
          type: string
          format: date-time

    ChildStatsResponse:
      type: object
      required:
        - childId
        - totalScore
        - rating
      properties:
        childId:
          type: string
          format: uuid
        totalScore:
          type: integer
          format: int32
        rating:
          type: integer
          format: int32

